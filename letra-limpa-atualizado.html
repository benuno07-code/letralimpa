<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2457D6">
<title>Letra Limpa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
/* Layout: início = estante de cadernos; editor = barra no topo, folha rolável, barra de ferramentas embaixo */
:root {
  --bg: #ECEFEA;
  --surface: #FFFFFF;
  --paper: #FDFDFB;
  --ink: #1B2430;
  --muted: #5B6773;
  --line: #D3D9D0;
  --rule: #B7D0E6;
  --margin: #E7A6A6;
  --dot: #8EA2B5;
  --accent: #2457D6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1E9FB;
  --hl-soft: rgba(255, 214, 64, 0.7);
  --danger: #C8362E;
  --danger-soft: #FBE6E4;
  --c-blue: #2457D6;
  --c-red: #D23B30;
  --c-green: #1D8A4C;
  --c-yellow: #F2BF00;
  --shadow: 0 1px 2px rgba(20, 30, 40, .08), 0 6px 18px rgba(20, 30, 40, .10);
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sidebar-w: 240px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161B; --surface: #1C2229; --paper: #20262D; --ink: #ECEFF2; --muted: #9AA7B4;
    --line: #323B45; --rule: #34495E; --margin: #6E3C3C; --dot: #5A6D80;
    --accent: #7EA2FF; --accent-ink: #0E1626; --accent-soft: #24304A;
    --hl-soft: rgba(255, 216, 77, 0.3); --danger: #FF7A70; --danger-soft: #3A2022;
    --c-blue: #7EA2FF; --c-red: #FF8077; --c-green: #5FD08A; --c-yellow: #FFD84D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161B; --surface: #1C2229; --paper: #20262D; --ink: #ECEFF2; --muted: #9AA7B4;
  --line: #323B45; --rule: #34495E; --margin: #6E3C3C; --dot: #5A6D80;
  --accent: #7EA2FF; --accent-ink: #0E1626; --accent-soft: #24304A;
  --hl-soft: rgba(255, 216, 77, 0.3); --danger: #FF7A70; --danger-soft: #3A2022;
  --c-blue: #7EA2FF; --c-red: #FF8077; --c-green: #5FD08A; --c-yellow: #FFD84D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--f-body);
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#app { height: 100%; display: flex; flex-direction: column; min-width: 0; }

/* ---------- botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: var(--ink); }
.icon-btn:hover, .btn.ghost:hover { background: var(--accent-soft); }
.icon-btn[disabled] { opacity: .35; cursor: default; }

/* ---------- início ---------- */
.home { flex: 1; min-height: 0; overflow: auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.home-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.home-head h1 { font: 800 clamp(30px, 6vw, 44px)/1.05 var(--f-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.home-head h1 mark { background: linear-gradient(transparent 56%, var(--hl-soft) 56% 92%, transparent 92%); color: inherit; padding: 0 .08em; }
.home-head p { margin: 6px 0 0; color: var(--muted); }
.head-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 26px 20px; }
.nb { min-width: 0; }
.cv-btn { display: block; width: 100%; text-align: left; }
.cover { position: relative; display: block; aspect-ratio: 3 / 4; max-width: 100%; background: var(--cv); border-radius: 6px 14px 14px 6px; overflow: hidden; box-shadow: var(--shadow); }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0) 14%, rgba(255,255,255,.08) 100%); pointer-events: none; }
.spiral { position: absolute; left: 0; top: 0; bottom: 0; width: 20px; z-index: 2;
  background: radial-gradient(ellipse 7px 4.5px at 50% 50%, rgba(255,255,255,.92) 0 55%, rgba(0,0,0,.35) 60% 100%, transparent 101%) 0 0 / 100% 20px repeat-y; }
.label { position: absolute; z-index: 3; left: 30px; right: 12px; bottom: 14px; padding: 7px 9px; background: #FFFFFF; color: #1B2430; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.25); display: grid; gap: 1px; }
.label b { font: 700 13px/1.2 var(--f-display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.label small { font-size: 10.5px; color: #5B6773; letter-spacing: .04em; text-transform: uppercase; }
.nb-meta { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; margin-top: 10px; min-width: 0; }
.nb-meta div { min-width: 0; display: grid; }
.nb-meta strong { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nb-meta span { color: var(--muted); font-size: 13px; }
.nb-meta .icon-btn { margin: -8px -8px 0 0; }
.empty { grid-column: 1 / -1; padding: 36px 0; display: grid; gap: 14px; justify-items: start; max-width: 460px; }
.empty h2 { margin: 0; font: 700 22px/1.2 var(--f-display); }
.empty p { margin: 0; color: var(--muted); }
.warn { margin: 0 0 18px; padding: 12px 14px; border-radius: 12px; background: var(--danger-soft); color: var(--danger); font-weight: 500; }

/* ---------- menus e janelas ---------- */
.pop-bg { position: fixed; inset: 0; z-index: 40; }
.pop { position: fixed; z-index: 41; min-width: 200px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: grid; }
.pop button { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 10px; text-align: left; font-weight: 500; }
.pop button:hover { background: var(--accent-soft); }
.pop button.danger { color: var(--danger); }
.pop button.danger:hover { background: var(--danger-soft); }
.pop .mini { flex: none; width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background-color: var(--paper); }
.modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 18, .55); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(100%, 520px); max-height: 100%; overflow: auto; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 18px; min-width: 0; }
.modal.wide { width: min(100%, 760px); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.modal-head h2 { margin: 0; font: 700 22px/1.2 var(--f-display); text-wrap: balance; }
.modal-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 600; font-size: 13px; letter-spacing: .02em; color: var(--muted); }
.text-in { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.cover-pick { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: start; }
.cover-pick .cover { width: 96px; border-radius: 4px 10px 10px 4px; }
.cover-pick .label { left: 18px; right: 6px; bottom: 8px; padding: 3px 5px; }
.cover-pick .label b { font-size: 9px; }
.cover-pick .label small { display: none; }
.cover-pick .spiral { width: 13px; background-size: 100% 13px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 34px; height: 34px; border-radius: 50%; background: var(--sw); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.typegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.typeopt { display: grid; gap: 8px; justify-items: center; padding: 10px; border-radius: 14px; border: 2px solid var(--line); font-weight: 600; font-size: 13px; }
.typeopt .thumb { width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; border: 1px solid var(--line); background-color: var(--paper); }
.typeopt small { color: var(--muted); font-weight: 400; margin-top: -6px; }
.typeopt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
#nbkinds .typeopt { min-height: 100px; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.sect { display: grid; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.sect:first-of-type { border-top: 0; padding-top: 0; }
.sect h3 { margin: 0; font: 700 16px/1.2 var(--f-display); }
.stepper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stepper output { min-width: 64px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.cmbox { background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 2px; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; width: 100%; text-align: left; }
.switch i { flex: none; width: 48px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.switch[aria-checked="true"] i { background: var(--accent); }
.switch[aria-checked="true"] i::after { transform: translateX(20px); }

/* ---------- treino da letra ---------- */
.train { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.pad-wrap { display: grid; gap: 10px; min-width: 0; }
.pad-label { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pad-label b { font: 800 34px/1 var(--f-display); }
.pad-label span { color: var(--muted); font-size: 13px; }
#pad { width: 100%; aspect-ratio: 3 / 2; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; touch-action: none; display: block; }
.chipgroups { display: grid; gap: 12px; min-width: 0; }
.tr-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tr-feedback { min-height: 42px; padding: 10px 12px; border-radius: 10px; background: var(--bg); color: var(--muted); font-size: 13px; }
.tr-actions .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.chipgroups h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; min-width: 38px; height: 38px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); display: inline-grid; place-items: center; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip em { position: absolute; top: -5px; right: -4px; min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px; background: var(--c-green); color: #fff; font: 700 10px/16px var(--f-body); font-style: normal; text-align: center; }
@media (max-width: 640px) { .train { grid-template-columns: minmax(0, 1fr); } }

/* ---------- EDITOR ---------- */
.ed { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.ed-container { display: flex; flex: 1; min-height: 0; min-width: 0; }

.ed-sidebar { width: var(--sidebar-w); border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; flex: none; }
.ed-sidebar-head { padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.ed-sidebar-content { flex: 1; overflow-y: auto; padding: 12px; display: grid; align-content: start; gap: 4px; }
.sidebar-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 10px 12px; border-radius: 8px; color: var(--muted); font-size: 14px; text-align: left; }
.sidebar-item small { font-size: 12px; opacity: .8; }
.sidebar-item:hover { background: var(--bg); color: var(--ink); }
.sidebar-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.ed-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }

.ed-top-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.ed-title { min-width: 0; }
.ed-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
.ed-title span { font-size: 12px; color: var(--muted); }
.ed-status { font-size: 12px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.status-indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--c-green); flex: none; }
.status-indicator.saving { background: var(--c-yellow); animation: pulse 1.5s infinite; }
.status-indicator.error { background: var(--c-red); }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

.stage { flex: 1; min-height: 0; overflow: auto; padding: 12px 12px 28px; background: var(--bg); overscroll-behavior: contain; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; display: flex; align-items: flex-start; justify-content: flex-start; }
.sheet { position: relative; flex: none; margin: 0 auto; background-color: var(--paper); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
.page-zones { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; border-radius:6px; }
.zone-bg { position:absolute; left:0; width:100%; pointer-events:none; }
#cv { position: absolute; left: 0; top: 0; z-index:1; display: block; touch-action: none; cursor: crosshair; }
.ed-extra-actions { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.ed-extra-actions .btn { min-height:38px; padding:0 10px; font-size:13px; }
.zone-row { display:grid; grid-template-columns:minmax(120px,1fr) 90px 40px; gap:8px; align-items:center; }
.zone-row .text-in { min-height:40px; padding:0 8px; }
.zone-pct { color:var(--muted); font-size:12px; }
@media (max-width:768px) { .ed-extra-actions .btn { min-height:36px; padding:0 8px; font-size:12px; } .ed-top-bar { gap:6px; } }
@media print { body { background:#fff !important; } }
.zoom-controls { display:flex; align-items:center; gap:3px; margin-left:6px; padding-left:8px; border-left:1px solid var(--line); }
.zoom-controls button { min-width:32px; height:34px; padding:0 8px; border:1px solid var(--line); border-radius:8px; font-weight:700; background:var(--surface); }
.zoom-controls button:hover { background:var(--accent-soft); }
.zoom-controls output { min-width:46px; text-align:center; font-size:12px; font-weight:700; color:var(--muted); }
#cv { position: absolute; left: 0; top: 0; display: block; touch-action: none; cursor: crosshair; }
.stage.hand #cv { cursor: grab; }
.stage.sel #cv { cursor: pointer; }

.tools { border-top: 1px solid var(--line); background: var(--surface); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 18px; padding: 12px 12px max(12px, env(safe-area-inset-bottom, 0px)); }
.tgroup { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tool { display: grid; justify-items: center; gap: 1px; min-width: 60px; min-height: 52px; padding: 6px 8px; border-radius: 12px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tool.letter[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.dot { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; }
.dot[aria-pressed="true"] { background: var(--accent-soft); }
.dot i { display: block; border-radius: 50%; background: var(--ink); }
.cdot { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--surface); background: var(--cc); box-shadow: 0 0 0 1px var(--line); }
.cdot[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.sep { width: 1px; align-self: stretch; background: var(--line); }
.lines { min-width: 76px; text-align: center; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.tool.lock[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

@media (max-width: 768px) {
  .ed-sidebar { display: none; }
  .sep { display: none; } .tool { min-width: 52px; }
  .ed-title strong { max-width: 36vw; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- login ---------- */
#auth { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg); color: var(--ink); font-family: Figtree, system-ui, sans-serif; }
#auth .box { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
#auth h1 { font: 800 26px 'Bricolage Grotesque', system-ui, sans-serif; margin: 0 0 4px; }
#auth p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
#auth input { width: 100%; padding: 13px 14px; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); font: 500 16px Figtree, system-ui, sans-serif; }
#auth button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--ink); color: var(--surface); font: 700 16px Figtree, system-ui, sans-serif; cursor: pointer; }
#auth button:disabled { opacity: .6; }
#auth .alt { background: none; color: var(--muted); font-weight: 600; font-size: 14px; margin-top: 8px; min-height: 44px; }
#auth .err { color: #C0392B; font-size: 14px; min-height: 18px; margin: 0 0 8px; }

#splash { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: linear-gradient(160deg, #2F6BF0, #173A9A); color: #fff; font-family: Figtree, system-ui, sans-serif; transition: opacity .35s; }
#splash.off { opacity: 0; pointer-events: none; }
#splash .sp-ic { width: 132px; height: 132px; filter: drop-shadow(0 12px 24px rgba(5,15,60,.4)); }
#splash h1 { margin: 0; font: 800 30px 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: .2px; }
#splash p { margin: 0; font-size: 14px; opacity: .8; }
#splash .sp-bar { width: 140px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
#splash .sp-bar i { display: block; width: 45%; height: 100%; border-radius: 4px; background: #fff; animation: spmove 1.1s ease-in-out infinite; }
@keyframes spmove { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
</style>
</head>
<body>

<div id="splash" role="status" aria-live="polite"><svg class="sp-ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" aria-hidden="true">
  <defs>
    <linearGradient id="spbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BF0"/><stop offset="1" stop-color="#1B3FA8"/>
    </linearGradient>
    <filter id="spsh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1B4D" flood-opacity=".35"/>
    </filter>

<script>
/* Reconhecedor de traços (nuvem de pontos, estilo $P). Funciona offline, sem biblioteca.
   Cada molde é uma lista de traços; cada traço é uma lista de [x, y]. */
const Recog = (function () {
  const N = 32;
  const PI = Math.PI;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function toPts(strokes) {
    const out = [];
    strokes.forEach((s, i) => s.forEach((p) => out.push({ x: p[0], y: p[1], id: i })));
    return out;
  }
  function pathLen(pts) {
    let d = 0;
    for (let i = 1; i < pts.length; i++) d += dist(pts[i - 1], pts[i]);
    return d;
  }
  // Reamostra cada traço separadamente. Assim, pontos isolados (pingo do i/j,
  // acentos e pontos finais) não desaparecem quando a nuvem é normalizada.
  function resample(pts, n) {
    if (!pts.length) return [];
    const groups = [];
    for (const p of pts) {
      let g = groups[groups.length - 1];
      if (!g || g[0].id !== p.id) { g = []; groups.push(g); }
      g.push(p);
    }
    if (groups.length > n) {
      // Para escritas longas, mantém os traços mais longos e não ultrapassa N pontos.
      groups.sort((a, b) => pathLen(b) - pathLen(a));
      groups.length = n;
    }
    const lengths = groups.map(pathLen);
    const total = lengths.reduce((a, v) => a + v, 0);
    const counts = groups.map(() => 1);
    let remaining = Math.max(0, n - groups.length);
    if (remaining) {
      const mean = total / Math.max(1, groups.length);
      const weights = lengths.map(v => Math.max(v, mean * 0.18, 0.001));
      const weightTotal = weights.reduce((a, v) => a + v, 0);
      const fractions = [];
      let used = 0;
      for (let i = 0; i < groups.length; i++) {
        const quota = remaining * weights[i] / weightTotal;
        const whole = Math.floor(quota);
        counts[i] += whole; used += whole;
        fractions.push({ i, f: quota - whole });
      }
      fractions.sort((a, b) => b.f - a.f);
      for (let i = 0; i < remaining - used; i++) counts[fractions[i % fractions.length].i]++;
    }
    function atDistance(g, len, target) {
      if (g.length === 1 || len <= 1e-9) return { x: g[0].x, y: g[0].y, id: g[0].id };
      let walked = 0;
      for (let j = 1; j < g.length; j++) {
        const seg = dist(g[j - 1], g[j]);
        if (walked + seg >= target) {
          const t = seg ? (target - walked) / seg : 0;
          return { x: g[j - 1].x + (g[j].x - g[j - 1].x) * t,
            y: g[j - 1].y + (g[j].y - g[j - 1].y) * t, id: g[0].id };
        }
        walked += seg;
      }
      const last = g[g.length - 1]; return { x: last.x, y: last.y, id: g[0].id };
    }
    const out = [];
    groups.forEach((g, i) => {
      const count = counts[i], len = lengths[i];
      for (let j = 0; j < count; j++) out.push(atDistance(g, len, count <= 1 ? len * 0.5 : len * j / (count - 1)));
    });
    // Ajuste por arredondamento da distribuição de pontos.
    while (out.length < n) out.push(out[out.length - 1] || pts[0]);
    return out.slice(0, n);
  }
  function normalize(pts) {
    let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    for (const p of pts) {
      if (p.x < x1) x1 = p.x;
      if (p.y < y1) y1 = p.y;
      if (p.x > x2) x2 = p.x;
      if (p.y > y2) y2 = p.y;
    }
    const s = Math.max(x2 - x1, y2 - y1) || 1;
    const q = pts.map((p) => ({ x: (p.x - x1) / s, y: (p.y - y1) / s, id: p.id }));
    let cx = 0, cy = 0;
    q.forEach((p) => { cx += p.x; cy += p.y; });
    cx /= q.length; cy /= q.length;
    return q.map((p) => ({ x: p.x - cx, y: p.y - cy, id: p.id }));
  }
  function cloud(strokes) {
    const clean = (strokes || []).filter((s) => Array.isArray(s) && s.length);
    if (!clean.length) return null;

    // Representamos esse ponto como um círculo pequeno, proporcional à letra inteira.
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const st of clean) for (const p of st) {
      x1 = Math.min(x1, p[0]); y1 = Math.min(y1, p[1]);
      x2 = Math.max(x2, p[0]); y2 = Math.max(y2, p[1]);
    }
    const scale = Math.max(x2 - x1, y2 - y1, 1);
    const dotR = Math.max(0.6, scale * 0.035);

      if (st.length !== 1) return st;
      const [x, y] = st[0];
      return Array.from({ length: 8 }, (_, i) => {
        const a = (2 * PI * i) / 8;
        return [x + Math.cos(a) * dotR, y + Math.sin(a) * dotR];

  function cd(a, b, start, lim) {
    const n = a.length;
    const m = new Array(n).fill(false);
    let sum = 0, i = start;
    do {
      let idx = -1, min = 1e9;
      for (let j = 0; j < n; j++) {
        if (!m[j]) {
          const d = Math.hypot(a[i].x - b[j].x, a[i].y - b[j].y);
          if (d < min) { min = d; idx = j; }
        }
      }
      m[idx] = true;
      const w = 1 - ((i - start + n) % n) / n;
      sum += w * min;
      if (sum >= lim) return sum;
      i = (i + 1) % n;
    } while (i !== start);

  }

    const n = a.length;

    5: [
      [[[85, 0], [25, 0], [20, 45], ...arc(48, 68, 36, 32, 1.2 * PI, 2.85 * PI)]],
      [[[20, 0], [20, 45], ...arc(48, 68, 36, 32, 1.2 * PI, 2.85 * PI)], [[85, 0], [22, 0]]],
    ],
    6: [
      [[[72, 0], [45, 20], [25, 50], [18, 70], ...ell(50, 70, 32, 30)]],
      [[[65, 0], [28, 45], [18, 72]], ell(50, 72, 32, 28)],

    7: [
      [[[10, 0], [90, 0], [35, 100]]],
      [[[10, 0], [90, 0], [35, 100]], [[25, 50], [70, 50]]],
    ],
    8: [[ell(50, 25, 28, 24), ell(50, 74, 34, 26)], [eight]],
    9: [
      [ell(50, 30, 32, 30), [[82, 30], [80, 62], [58, 92], [32, 100]]],
      [ell(50, 28, 30, 26), [[80, 28], [80, 100]]],
    ],
    '+': [[[[8, 50], [92, 50]], [[50, 8], [50, 92]]]],
    '-': [[[[5, 50], [95, 50]]]],
    '=': [[[[8, 35], [92, 35]], [[8, 65], [92, 65]]]],
    '/': [[[[80, 0], [20, 100]]]],
    '(': [[arc(70, 50, 40, 50, PI * 0.55, PI * 1.45)]],
    ')': [[arc(30, 50, 40, 50, -PI * 0.45, PI * 0.45)]],
    x: [[[[10, 10], [90, 90]], [[90, 10], [10, 90]]]],
  };

  /* Moldes de letras de forma (impressas). A cursiva personalizada continua sendo
     aprendida pelas amostras do usuário. Os moldes são caminhos simples para dar uma
     referência inicial, sem depender de bibliotecas externas. */
  const poly = (...pts) => pts;
  const ALPHA = {
    A: [[poly([10,100],[50,0],[90,100]), poly([27,64],[73,64])]],
    B: [[poly([18,0],[18,100]), arc(18,25,34,25,-PI/2,PI/2,16), arc(18,74,36,26,-PI/2,PI/2,18)]],
    C: [[arc(52,50,40,48,PI/3,2*PI-PI/3,24)]],
    D: [[poly([18,0],[18,100]), arc(18,50,42,50,-PI/2,PI/2,22)]],
    E: [[poly([16,0],[16,100]), poly([16,0],[86,0]), poly([16,50],[72,50]), poly([16,100],[88,100])]],
    F: [[poly([18,100],[18,0],[86,0]), poly([18,48],[70,48])]],
    G: [[arc(52,50,40,48,PI/3,2*PI-PI/3,24), poly([52,52],[91,52],[91,72])]],
    H: [[poly([16,0],[16,100]), poly([84,0],[84,100]), poly([16,52],[84,52])]],
    I: [[poly([18,0],[82,0]), poly([50,0],[50,100]), poly([18,100],[82,100])]],
    J: [[poly([18,0],[88,0],[88,70],[78,92],[55,100],[32,91],[27,78])]],
    K: [[poly([18,0],[18,100]), poly([82,0],[22,54],[88,100])]],
    L: [[poly([18,0],[18,100],[88,100])]],
    M: [[poly([10,100],[10,0],[50,54],[90,0],[90,100])]],
    N: [[poly([15,100],[15,0],[85,100],[85,0])]],
    O: [[ell(50,50,39,49)]],
    P: [[poly([18,100],[18,0]), arc(18,27,35,27,-PI/2,PI/2,16)]],
    Q: [[ell(50,48,39,46), poly([59,70],[91,100])]],
    R: [[poly([18,100],[18,0]), arc(18,27,35,27,-PI/2,PI/2,16), poly([45,53],[88,100])]],
    S: [[poly([84,10],[65,0],[35,0],[14,18],[24,39],[70,60],[85,80],[65,100],[28,100],[10,90])]],
    T: [[poly([8,0],[92,0]), poly([50,0],[50,100])]],
    U: [[poly([14,0],[14,70],[22,91],[50,100],[78,91],[86,70],[86,0])]],
    V: [[poly([10,0],[50,100],[90,0])]],
    W: [[poly([8,0],[25,100],[50,54],[75,100],[92,0])]],
    X: [[poly([12,0],[88,100]), poly([88,0],[12,100])]],
    Y: [[poly([10,0],[50,48],[90,0]), poly([50,48],[50,100])]],
    Z: [[poly([12,0],[88,0],[12,100],[88,100])]],
    a: [[ell(43,62,26,30), poly([69,37],[69,94])]],
    b: [[poly([27,0],[27,96]), ell(54,65,27,29)]],
    c: [[arc(50,62,29,30,PI/3,2*PI-PI/3,18)]],
    d: [[ell(43,62,26,30), poly([69,0],[69,96])]],
    e: [[arc(50,62,29,30,PI/3,2*PI-PI/3,18), poly([24,61],[72,58])]],
    f: [[poly([68,8],[55,0],[42,8],[38,34],[38,100]), poly([19,42],[62,42])]],
    g: [[ell(43,57,25,27), poly([68,36],[68,87],[59,99],[39,100])]],
    h: [[poly([26,0],[26,100]), poly([27,53],[41,34],[57,31],[70,45],[70,100])]],
    i: [[poly([50,40],[50,96]), ell(50,16,3.5,3.5)]],
    j: [[poly([61,38],[61,88],[52,100],[38,98]), ell(61,14,3.5,3.5)]],
    k: [[poly([28,0],[28,100]), poly([72,38],[31,66],[76,96])]],
    l: [[poly([50,0],[50,100])]],
    m: [[poly([16,96],[16,38],[28,28],[40,36],[42,96]), poly([42,44],[54,29],[68,35],[73,47],[73,96]), poly([73,46],[84,33],[94,40],[96,96])]],
    n: [[poly([24,96],[24,38],[36,28],[52,32],[66,45],[66,96])]],
    o: [[ell(50,62,28,31)]],
    p: [[poly([25,34],[25,100]), ell(52,57,27,27)]],
    q: [[ell(43,58,27,28), poly([70,37],[70,100])]],
    r: [[poly([27,96],[27,38],[39,28],[53,34])]],
    s: [[poly([73,39],[59,30],[39,33],[29,45],[42,57],[62,65],[72,77],[61,91],[40,94],[27,86])]],
    t: [[poly([48,13],[48,85],[58,96],[70,91]), poly([29,41],[68,41])]],
    u: [[poly([25,38],[25,73],[34,91],[49,95],[65,82],[65,38]), poly([65,78],[65,96])]],
    v: [[poly([20,38],[48,96],[78,38])]],
    w: [[poly([14,39],[29,96],[48,60],[67,96],[88,39])]],
    x: [[poly([25,38],[75,96]), poly([75,38],[25,96])]],
    y: [[poly([20,38],[48,93],[71,39]), poly([71,39],[55,82],[43,100],[29,98])]],

  function addAccent(base, kind, upper) {

      const sourceStrokes = base.toLowerCase() === 'i' && !upper ? variant.slice(0, 1) : variant;
      const body = sourceStrokes.map(st => st.map(([x,y]) => [10 + x * 0.8, 22 + y * 0.76]));

      else if (kind === 'grave') mark = poly([67,18],[53,2]);
      else if (kind === 'circ') mark = poly([40,18],[50,3],[60,18]);
      else if (kind === 'tilde') mark = poly([38,12],[46,4],[55,12],[64,4]);
      else if (kind === 'umlaut') { body.push(poly([43,12],[43,12]), poly([61,12],[61,12])); return body; }
      else if (kind === 'cedilla') { body.push(poly([54,88],[48,95],[57,100])); return body; }
      if (upper) mark = mark.map(([x,y]) => [x, y * 0.75 + 2]);
      body.push(mark);

    ['é','e','acute'],['ê','e','circ'],['í','i','acute'],['ó','o','acute'],
    ['ô','o','circ'],['õ','o','tilde'],['ú','u','acute'],['ü','u','umlaut'],['ç','c','cedilla']

    ['Á','A','acute'],['À','A','grave'],['Â','A','circ'],['Ã','A','tilde'],
    ['É','E','acute'],['Ê','E','circ'],['Í','I','acute'],['Ó','O','acute'],
    ['Ô','O','circ'],['Õ','O','tilde'],['Ú','U','acute'],['Ü','U','umlaut'],['Ç','C','cedilla']

     Amostras do usuário vêm primeiro: costumam ganhar, e isso poda mais cedo as outras. */
  function templates(train) {
    const t = [];
    for (const ch in train || {}) {
      for (const s of train[ch] || []) {
        const c = cloud(s);
        if (c) t.push({ ch, cloud: c, user: true });

  // que podia congelar a folha quando havia muitas amostras de treinamento.
  function fastCloudDistance(a, b) {
    if (!a || !b || !a.length || !b.length) return 1e9;
    let sum = 0;
    for (const p of a) {
      let best = 1e9;
      for (const q of b) { const d = Math.hypot(p.x - q.x, p.y - q.y); if (d < best) best = d; }
      sum += best;
    }
    for (const p of b) {
      let best = 1e9;
      for (const q of a) { const d = Math.hypot(p.x - q.x, p.y - q.y); if (d < best) best = d; }

      const ch = String(t.ch);
      const d = fastCloudDistance(c, t.cloud) * (t.user ? 0.82 : 1);
      if (!byChar.has(ch) || d < byChar.get(ch)) byChar.set(ch, d);

      .sort((a, b) => a.dist - b.dist).slice(0, Math.max(1, limit));

function setupPad() {
  const pad = $('#pad');
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const r = pad.getBoundingClientRect();
  pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr);
  const x = pad.getContext('2d');
  TR.cur = null;
  TR.paint = () => {
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, pad.width, pad.height);
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (TR.showGuide) {
      const cs = getComputedStyle(document.documentElement);
      x.save(); x.globalAlpha = 0.13; x.fillStyle = cs.getPropertyValue('--muted').trim() || '#7B8794';
      const guideSize = Math.min(116, r.height * 0.62, (r.width - 24) / Math.max(1.8, Array.from(TR.ch).length * 0.62));
      x.font = `500 ${guideSize}px Figtree, system-ui, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(TR.ch, r.width / 2, r.height / 2, r.width - 20); x.restore();
      x.save(); x.globalAlpha = 0.25; x.strokeStyle = cs.getPropertyValue('--rule').trim() || '#B7D0E6'; x.lineWidth = 1;
      x.beginPath(); x.moveTo(8, r.height * 0.72); x.lineTo(r.width - 8, r.height * 0.72); x.stroke(); x.restore();
    }
    x.strokeStyle = palette().ink; x.lineWidth = 3; x.lineCap = 'round'; x.lineJoin = 'round';
    for (const s of TR.strokes) { const p = []; s.forEach((q) => p.push(q[0], q[1])); strokePath(x, p); }
  };
  const pos = (e) => { const b = pad.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  pad.addEventListener('pointerdown', (e) => { e.preventDefault(); try { pad.setPointerCapture(e.pointerId); } catch (_) {} TR.cur = [pos(e)]; TR.strokes.push(TR.cur); TR.paint(); });
  pad.addEventListener('pointermove', (e) => { if (!TR.cur) return; e.preventDefault(); const q = pos(e), l = TR.cur[TR.cur.length - 1]; if (Math.hypot(q[0] - l[0], q[1] - l[1]) > 1.5) { TR.cur.push(q); TR.paint(); } });
  const end = () => { TR.cur = null; };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
}
function trSave() {
  const strokes = TR.strokes.filter((s) => s.length > 0);
  if (!strokes.length) { TR.feedback = 'Desenhe o caractere antes de salvar a amostra.'; trInfo(); return; }
  const norm = Recog.normStrokes(strokes);
  const list = S.train[TR.ch] || (S.train[TR.ch] = []);
  list.push(norm);
  if (list.length > 10) list.shift();
  tpls = Recog.templates(S.train);
  markMeta();
  TR.strokes = []; TR.cur = null;
  TR.feedback = `Amostra salva para “${TR.ch}”. Você já tem ${list.length}; tente salvar mais ${Math.max(0, 3 - list.length)} para fortalecer o reconhecimento.`;
  TR.paint(); trInfo();
}
function trMove(delta) {
  TR.isWord = false;
  const idx = FLAT.indexOf(TR.ch);
  TR.ch = FLAT[(idx + delta + FLAT.length) % FLAT.length];
  TR.strokes = []; TR.cur = null;

function trTest() {
  const strokes = TR.strokes.filter((s) => s.length > 0);
  if (!strokes.length) { TR.feedback = 'Desenhe primeiro um exemplo para testar.'; trInfo(); return; }
  const r = Recog.match(strokes, TR.isWord ? wordTemplates() : characterTemplates());
  if (!r) TR.feedback = 'Não consegui comparar o traço. Tente desenhar maior e com mais cuidado.';
  else if (r.ambiguous) TR.feedback = `O desenho ficou parecido com “${r.ch}” e “${r.alternative}”. Salve mais exemplos para diferenciar essas letras.`;
  else if (r.dist > THR) TR.feedback = `O melhor palpite foi “${r.ch}”, mas a confiança ficou baixa. Salve mais exemplos de “${TR.ch}” e tente novamente.`;
  else TR.feedback = `O melhor palpite é “${r.ch}” (alvo: “${TR.ch}”). ${r.ch === TR.ch ? 'Boa! O modelo reconheceu a letra escolhida.' : 'Se não bateu, salve mais exemplos desta letra e de letras parecidas.'}`;
  trInfo();
}

let OCR_JOB = null;
function loadExternalScript(src, ready) {
  if (ready()) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const old = document.querySelector(`script[data-external-src="${src}"]`);
    if (old && old.dataset.failed === '1') old.remove();
    else if (old) { old.addEventListener('load', resolve, { once:true }); old.addEventListener('error', () => reject(new Error('Não foi possível carregar a biblioteca externa.')), { once:true }); return; }
    const el = document.createElement('script'); el.src = src; el.async = true; el.dataset.externalSrc = src;
    el.onload = () => { el.dataset.loaded = '1'; ready() ? resolve() : reject(new Error('A biblioteca foi carregada, mas não ficou disponível.')); };
    el.onerror = () => { el.dataset.failed = '1'; reject(new Error('Não consegui baixar o componente de leitura. Verifique a internet.')); };
    document.head.appendChild(el);
  });
}
async function getImageCanvas(file) {
  let bitmap;
  if (window.createImageBitmap) bitmap = await createImageBitmap(file);
  else {
    const url = URL.createObjectURL(file);
    try { bitmap = await new Promise((resolve,reject) => { const im = new Image(); im.onload=()=>resolve(im); im.onerror=reject; im.src=url; }); }
    finally { setTimeout(()=>URL.revokeObjectURL(url), 1000); }
  }
  const maxSide = 1800, factor = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(bitmap.width * factor)); canvas.height = Math.max(1, Math.round(bitmap.height * factor));
  canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  if (bitmap.close) bitmap.close();
  return canvas;
}
async function fileToExerciseCanvases(file, status) {

function wrapExerciseLine(line, maxWidth, fontHeight) {

    if (cur && width(trial) > maxWidth) { out.push(cur); cur=word; }

    }
  }

  return out;
}

function textItems(str, x, y, h, c) {
  const out = [];
  let cx = x;
  for (const ch of str) {
    if (ch === ' ') { cx += h * 0.82; continue; }
    let w = h * 0.55, bh = h, by = y;
    if (ch === '=' || ch === '+') { w = h * 0.5; bh = h * 0.5; by = y + h * 0.25; }
    else if (ch === '-') { w = h * 0.4; bh = h * 0.1; by = y + h * 0.45; }
    else if (ch === 'x') { bh = h * 0.62; by = y + h * 0.38; }
    out.push({ k: 'g', ch, c, x: cx, y: by, w, h: bh });
    cx += w + h * 0.14;
  }
  return { out, end: cx };
}
const CALLIGRAPHY_LOWER = Array.from('abcdefghijklmnopqrstuvwxyzáàâãéêíóôõúüç');
const CALLIGRAPHY_UPPER = Array.from('ABCDEFGHIJKLMNOPQRSTUVWXYZÁÀÂÃÉÊÍÓÔÕÚÜÇ');
function calligraphyLessons() {
  const lessons = [];
  for (const [group, chars, script] of [
    ['Minúscula · bastão', CALLIGRAPHY_LOWER, 'print'],
    ['Minúscula · cursiva', CALLIGRAPHY_LOWER, 'cursive'],
    ['Maiúscula · bastão', CALLIGRAPHY_UPPER, 'print'],
    ['Maiúscula · cursiva', CALLIGRAPHY_UPPER, 'cursive'],
    ['Números · bastão', Array.from('0123456789'), 'print'],
    ['Números · estilo cursivo', Array.from('0123456789'), 'cursive']
  ]) for (const ch of chars) lessons.push({ ch, group, script });
  return lessons;
}
function addPracticeText(items, text, x, y, h, color, script, guide = false) {

  items.push(...made);
}

    case 'prev': if (S.pi > 0) gotoPage(S.pi - 1); break;
    case 'next': if (S.pi < S.nb.pages.length - 1) await gotoPage(S.pi + 1); else if (S.nb && S.nb.kind === 'calligraphy') await appendCalligraphyPage(); break;
    case 'goto': { const i = +el.dataset.i; if (i !== S.pi) gotoPage(i); break; }
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'addpage': popAt(el, Object.keys(TYPES).map((t) => `<button data-act="add-type" data-t="${t}"><span class="mini" style="${bgCss(t, 8)}"></span>Folha ${TYPES[t].toLowerCase()}</button>`).join('')); break;
    case 'add-type': {
      closeLayer(); convertPending();
      const pg = newPage(el.dataset.t);
      pages.set(pg.id, pg); dirtyPages.add(pg.id);
      S.nb.pages.splice(S.pi + 1, 0, pg.id);
      markMeta(); gotoPage(S.pi + 1); break;
    }
    case 'settings': layer.innerHTML = settingsHTML(); break;
    case 'exercise-menu': popAt(el, `<button data-act="exercise-camera">${icon('camera')} Tirar foto do exercício</button><button data-act="exercise-import">${icon('fileText')} Importar imagem ou PDF</button>`); break;
    case 'exercise-camera': closeLayer(); $('#exercise-camera').click(); break;
    case 'exercise-import': closeLayer(); $('#exercise-file').click(); break;
    case 'exercise-insert': { const title=$('#exercise-title')?.value?.trim() || `Exercício ${Number(S.settings.exerciseCounter)||1}`; const text=$('#exercise-text')?.value || ''; if (!text.trim()) { const ta=$('#exercise-text'); if (ta) { ta.focus(); ta.placeholder='Digite ou cole o enunciado antes de inserir.'; } break; } insertExercise(title,text); break; }
    case 'export-menu': exportMenu(); break;
    case 'export-page-png': exportCurrentPNG().catch((e)=>alert((e&&e.message)||'Falha ao exportar a folha.')); break;
    case 'export-nb-pdf': { closeLayer(); const win=window.open('about:blank','_blank'); exportNotebookPDF(win).catch((e)=>{ if(win) win.close(); alert((e&&e.message)||'Falha ao exportar o caderno.'); }); break; }
    case 'zone-add': { const current=page.zones && page.zones.length>1 ? page.zones.map(z=>({...z})) : [{type:page.type,weight:1}]; const avg=Math.max(1,Math.round(current.reduce((a,z)=>a+(+z.weight||1),0)/current.length)); const nextType=Object.keys(TYPES).find(t=>!current.some(z=>z.type===t)) || 'lisa'; current.push({type:nextType,weight:avg}); page.zones=current; markPage(); C.bk=null; applyBg(); updateHeader(); $('#layer').innerHTML=settingsHTML(); break; }
    case 'zone-remove': { const i=+el.dataset.i; const zones=page.zones && page.zones.length>1 ? page.zones.map(z=>({...z})) : [{type:page.type,weight:1}]; if(zones.length>1) zones.splice(i,1); if(zones.length<2){ page.type=zones[0].type; page.zones=[]; } else page.zones=zones; markPage(); C.bk=null; applyBg(); updateHeader(); $('#layer').innerHTML=settingsHTML(); break; }
    case 'zone-clear': if(page.zones && page.zones.length>1) page.type=page.zones[0].type; page.zones=[]; markPage(); C.bk=null; applyBg(); updateHeader(); $('#layer').innerHTML=settingsHTML(); break;
    case 'zoom-in': setZoom(viewZoom + 0.2); break;
    case 'zoom-out': setZoom(viewZoom - 0.2); break;
    case 'zoom-reset': setZoom(1); break;
    case 'set-type': page.type = el.dataset.t; page.zones=[]; markPage(); applyBg(); updateHeader(); $('#pgtypes').querySelectorAll('.typeopt').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === page.type))); $('#zone-editor').innerHTML=zoneEditorHTML(); break;
    case 'del-page': {
      if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Toque de novo para apagar'; break; }
      convertPending();
      const id = page.id;
      S.nb.pages.splice(S.pi, 1);
      pages.delete(id); hist.delete(id); dirtyPages.delete(id); DB.del('page:' + id);
      markMeta(); closeLayer(); gotoPage(Math.min(S.pi, S.nb.pages.length - 1)); break;
    }
    case 'cm-minus': case 'cm-plus': {
      S.settings.cm = clamp(S.settings.cm + (a === 'cm-plus' ? 1 : -1), 20, 80);
      $('#cmout').textContent = S.settings.cm + ' px';
      $('#cmbox').style.width = $('#cmbox').style.height = S.settings.cm + 'px';
      markMeta(); applyBg(); break;
    }
    case 'finger': S.settings.finger = !S.settings.finger; el.setAttribute('aria-checked', String(S.settings.finger)); markMeta(); break;
    case 'recognizeStraight': S.settings.recognizeStraight = !S.settings.recognizeStraight; el.setAttribute('aria-checked', String(S.settings.recognizeStraight)); markMeta(); break;
    case 'snapBaseline': S.settings.snapBaseline = !S.settings.snapBaseline; el.setAttribute('aria-checked', String(S.settings.snapBaseline)); markMeta(); break;
    case 'tool': convertPending(); S.tool = el.dataset.t; renderTools(); break;
    case 'color': S.col[S.tool] = el.dataset.c; savePrefs(); renderTools(); break;
    case 'size': S.sizeIdx = +el.dataset.i; savePrefs(); renderTools(); break;
    case 'toggle-convert': S.convert = !S.convert; if (!S.convert) cancelPending(); savePrefs(); renderTools(); break;
    case 'lock': S.settings.lock = !S.settings.lock; markMeta(); renderTools(); break;
    case 'lines-minus': case 'lines-plus': S.settings.lines = clamp(S.settings.lines + (a === 'lines-plus' ? 0.5 : -0.5), 0.5, 4); S.settings.lock = true; markMeta(); renderTools(); break;
    case 'penbtn': S.settings.penBtn = el.dataset.m; markMeta(); $('#penbtns').querySelectorAll('.typeopt').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.m === S.settings.penBtn))); break;
    case 'backup': backupModal(); break;
    case 'bk-in': $('#bkfile').click(); break;
    case 'bk-out': exportBackup().catch(() => backupModal('<p class="warn">Não consegui gerar o arquivo. Tente de novo.</p>')); break;
    case 'bk-go': doRestore(); break;
    case 'train': closeLayer(); openTrain(); break;
    case 'tr-pick': TR.ch = el.dataset.ch; TR.isWord = false; TR.strokes = []; TR.cur = null; TR.feedback = `Treinando “${TR.ch}”. Salve 3 a 5 exemplos para melhorar a identificação.`; TR.paint(); trInfo(); break;
    case 'tr-use-word': { const input = $('#tr-word'); const word = (input ? input.value : '').trim().replace(/\s+/g, ' '); if (Array.from(word).length < 2) { TR.feedback = 'Digite uma palavra com pelo menos duas letras.'; trInfo(); break; } TR.ch = word; TR.isWord = true; TR.strokes = []; TR.cur = null; TR.feedback = `Treinando a palavra cursiva “${TR.ch}”. Escreva a palavra inteira no quadro e salve 3 a 5 amostras.`; TR.paint(); trInfo(); break; }
    case 'tr-clear': TR.strokes = []; TR.cur = null; TR.feedback = 'Quadro limpo. Desenhe o caractere novamente.'; TR.paint(); trInfo(); break;
    case 'tr-undo': TR.strokes.pop(); TR.cur = null; TR.feedback = 'Último traço removido.'; TR.paint(); trInfo(); break;
    case 'tr-prev': trMove(-1); break;
    case 'tr-next': trMove(1); break;
    case 'tr-guide': TR.showGuide = !TR.showGuide; TR.paint(); trInfo(); break;
    case 'tr-test': trTest(); break;
    case 'tr-save': trSave(); break;
    case 'tr-reset': delete S.train[TR.ch]; tpls = Recog.templates(S.train); markMeta(); TR.strokes = []; TR.cur = null; TR.feedback = `Amostras de “${TR.ch}” apagadas.`; TR.paint(); trInfo(); break;
    case 'fix-ok': fixOk(); break;
    case 'fix-choice': fixChoice(el.dataset.choice); break;
    case 'fix-del': fixDel(); break;
  }
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-zone-weight]') && page) {
    const i=+e.target.dataset.zoneWeight; const zones=page.zones && page.zones.length>1 ? page.zones : [{type:page.type,weight:1}];
    if (zones[i]) { zones[i].weight=clamp(+e.target.value||1,1,100); if(page.zones && page.zones.length>1) page.zones=zones; applyBg(); markPage(); const total=zones.reduce((a,z)=>a+(+z.weight||1),0)||1; const lbl=e.target.parentElement.querySelector('.zone-pct'); if(lbl) lbl.textContent=Math.round((zones[i].weight/total)*100)+'% da folha'; }
  }
  if (e.target.id === 'delay') {
    S.settings.delay = +e.target.value;
    $('#delayout').textContent = (S.settings.delay / 1000).toFixed(1).replace('.', ',') + ' s';
    markMeta();
  }
});
document.addEventListener('change', (e) => {
  if (e.target.matches('[data-zone-type]') && page) {
    const i=+e.target.dataset.zoneType; const zones=page.zones && page.zones.length>1 ? page.zones.map(z=>({...z})) : [{type:page.type,weight:1}];
    if(zones[i]) { zones[i].type=e.target.value; if(zones.length<2){page.type=e.target.value; page.zones=[];} else page.zones=zones; markPage(); C.bk=null; applyBg(); updateHeader(); }
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && layer.innerHTML) { closeLayer(); F = null; FX = null; }
  else if (e.key === 'Enter' && e.target && e.target.id === 'fxch') fixOk();
  else if (page && !layer.innerHTML && (e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (page && !layer.innerHTML && (e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redo(); }
});
const themeChanged = () => { palCache = null; C.bk = null; if (page) redraw(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
/* ao sair ou esconder a aba: grava tudo local e manda para a nuvem na hora */
const saveAll = () => { convertPending(); flush(); if (window.LL_cloud) window.LL_cloud.flush(); };
window.addEventListener('pagehide', saveAll);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveAll(); });
if (document.fonts && document.fonts.load) {
  document.fonts.load('500 40px Figtree').then(() => { metr.clear(); C.bk = null; redraw(); }).catch(() => {});
}

/* ---------- começo (chamado pelo módulo do Firebase depois do login) ---------- */
let booted = false;
async function boot() {
  if (booted) return;
  booted = true;
  app.innerHTML = '<div class="home"><p class="hint">Abrindo seus cadernos…</p></div>';
  await DB.open('letra-limpa-' + (window.LL_uid || 'local'));
  await migrateLegacy();

  /* traz o que está na nuvem; o que só existe aqui sobe para a nuvem */
  if (window.LL_cloud) {
    try {
      const all = await window.LL_cloud.pullAll();
      const cloudKeys = new Set();
      for (const [k, v] of all) { cloudKeys.add(k); await DB.set(k, v, true); }
      for (const k of await DB.keys()) if (!cloudKeys.has(k)) window.LL_cloud.push(k, await DB.get(k));
    } catch (e) { /* sem rede: segue com o que tem neste aparelho */ }
  }

  const meta = await DB.get('meta');
  if (meta && Array.isArray(meta.nbs)) {
    S.nbs = meta.nbs;
    Object.assign(S.settings, meta.settings || {});
    if (!['hold', 'swap', 'lock', 'off'].includes(S.settings.penBtn)) S.settings.penBtn = 'hold';
    if (typeof S.settings.recognizeStraight !== 'boolean') S.settings.recognizeStraight = false;
    if (typeof S.settings.snapBaseline !== 'boolean') S.settings.snapBaseline = true;
    if (!Number.isFinite(S.settings.delay) || S.settings.delay < 900) S.settings.delay = 1400;
    if (!Number.isFinite(S.settings.exerciseCounter) || S.settings.exerciseCounter < 1) S.settings.exerciseCounter = 1;
    S.train = meta.train || {};
  }
  for (const nb of S.nbs) {
    if (nb.cover && nb.cover.kind === 'photo' && !nb.cover.data) {
      nb.cover.data = await DB.get('cover:' + nb.id);
    }
  }
  const pr = S.settings.prefs;
  if (pr) {
    Object.assign(S.col, pr.col || {});
    S.sizeIdx = pr.sizeIdx != null ? pr.sizeIdx : 1;
    S.convert = pr.convert !== false;
  }
  if (!meta && !S.nbs.length) { seedExample(); await flush(); }

  tpls = Recog.templates(S.train);
  const au = document.getElementById('auth');
  if (au) au.remove();
  renderHome();
  window.LL_splashOff();
}
window.LL_boot = boot;
})();
</script>

<!-- ================= FIREBASE: login + sincronização ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, deleteDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Configuração do app Web Letra Limpa (Firebase Console > Configurações do projeto > Seus apps). */
const firebaseConfig = {
  apiKey: "AIzaSyDBp8lmzbkjtUtoimt5ap_g_3CxIVon95Q",
  authDomain: "letra-e2606.firebaseapp.com",
  projectId: "letra-e2606",
  storageBucket: "letra-e2606.firebasestorage.app",
  messagingSenderId: "333929731151",
  appId: "1:333929731151:web:21360cf507a74c8020c63a"
};

const requiredConfig = ['apiKey', 'authDomain', 'projectId', 'appId'];
const configIncomplete = requiredConfig.some((key) => {
  const value = String(firebaseConfig[key] || '').trim();
  return !value || /COLE_AQUI|SEU-PROJETO|YOUR[_-]|EXAMPLE/i.test(value);
});

if (configIncomplete) {
  const err = document.getElementById('auth-err');
  if (err) err.textContent = 'Configure o Firebase neste HTML: substitua apiKey, authDomain, projectId e appId pelos dados reais do seu app Web no Console do Firebase.';
  if (window.LL_splashOff) window.LL_splashOff();
} else {
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- sincronização: users/{uid}/kv/{chave} = { k, t, json } ---------- */
const MAX_BYTES = 900000;            // margem segura abaixo do limite de ~1 MiB por documento
const queue = new Map();             // chave -> { del: bool, json: string }
let timer = 0, sending = null;
const enc = new TextEncoder();

function setSync(s) { window.LL_sync = s; if (window.LL_onSync) window.LL_onSync(); }
const ref = (k) => doc(db, 'users', auth.currentUser.uid, 'kv', k);

async function send() {
  if (!auth.currentUser || !queue.size) return;
  const batch = [...queue.entries()];
  queue.clear();
  let bad = false;
  await Promise.all(batch.map(async ([k, job]) => {
    try {
      if (job.del) {
        await deleteDoc(ref(k));
      } else {
        // O nome do documento e o campo k precisam corresponder às regras.
        await setDoc(ref(k), { k, t: Date.now(), json: job.json });
      }
    } catch (e) {
      bad = true;
      // Não substitui uma alteração mais nova que entrou na fila enquanto enviávamos.
      if (!queue.has(k)) queue.set(k, job);
      window.LL_syncError = (e && (e.code || e.message)) || 'erro-desconhecido';
    }
  }));
  if (!bad) window.LL_syncError = '';
  setSync(bad ? 'err' : (queue.size ? 'wait' : 'ok'));
  // Repete operações que falharam (incluindo exclusões), sem criar um ciclo apertado.
  if (bad && queue.size) {
    clearTimeout(timer);
    timer = setTimeout(flushNow, 5000);
  }
}
function flushNow() {
  clearTimeout(timer); timer = 0;
  sending = (sending || Promise.resolve()).then(send).catch(() => setSync('err'));
  return sending;
}

window.LL_cloud = {
  push(k, v) {
    if (!auth.currentUser) return;
    let json;
    try { json = JSON.stringify(v === undefined ? null : v); } catch (e) { return; }
    if (enc.encode(json).length >= MAX_BYTES) {
      queue.delete(k);
      window.LL_syncError = 'documento-grande-demais';
      setSync('big');
      return;
    }
    queue.set(k, { del: false, json });
    window.LL_syncError = '';
    setSync('wait');
    clearTimeout(timer); timer = setTimeout(flushNow, 1500);
  },
  remove(k) {
    if (!auth.currentUser) return;
    queue.set(k, { del: true });
    window.LL_syncError = '';
    setSync('wait');
    clearTimeout(timer); timer = setTimeout(flushNow, 1500);
  },
  flush: flushNow,
  async pullAll() {
    if (!auth.currentUser) throw new Error('Usuário não autenticado para sincronizar.');
    const out = [];
    try {
      const snap = await getDocs(collection(db, 'users', auth.currentUser.uid, 'kv'));
      snap.forEach((d) => {
        try {
          const data = d.data();
          // Lê o formato atual (json) e também documentos antigos (d) para migrá-los.
          const raw = typeof data.json === 'string' ? data.json : data.d;
          if (typeof raw === 'string') out.push([d.id, JSON.parse(raw)]);
        } catch (e) {
          console.warn('Documento de sincronização ignorado:', d.id, e);
        }
      });
      setSync('ok');
      window.LL_syncError = '';
      return out;
    } catch (e) {
      setSync('err');
      window.LL_syncError = (e && (e.code || e.message)) || 'erro-desconhecido';
      throw e; // Não finge que a nuvem está vazia quando a leitura foi negada.
    }
  }
};
window.LL_logout = async () => { try { await signOut(auth); } finally { location.reload(); } };

/* ---------- tela de login ---------- */
const $ = (id) => document.getElementById(id);
let signup = false;
function setMode(s) {
  signup = s;
  $('auth-sub').textContent = s ? 'Crie sua conta com e-mail e senha.' : 'Entre com seu e-mail e senha.';
  $('auth-go').textContent = s ? 'Criar conta' : 'Entrar';
  $('auth-mode').textContent = s ? 'Já tenho cadastro' : 'Ainda não tenho cadastro';
  $('auth-pass').autocomplete = s ? 'new-password' : 'current-password';
  $('auth-err').textContent = '';
}
const MSG = {
  'auth/invalid-email': 'E-mail inválido.',
  'auth/missing-password': 'Digite a senha.',
  'auth/weak-password': 'Senha fraca: use pelo menos 6 caracteres.',
  'auth/email-already-in-use': 'Este e-mail já tem cadastro. Toque em "Já tenho cadastro".',
  'auth/invalid-credential': 'E-mail ou senha incorretos.',
  'auth/user-not-found': 'E-mail ou senha incorretos.',
  'auth/wrong-password': 'E-mail ou senha incorretos.',
  'auth/too-many-requests': 'Muitas tentativas. Espere um pouco e tente de novo.',
  'auth/network-request-failed': 'Sem conexão com a internet.',
  'auth/operation-not-allowed': 'Login por e-mail não está ativado no Firebase.',
  'auth/invalid-api-key': 'A apiKey do Firebase é inválida. Copie a configuração correta do app Web no Console do Firebase.',
  'auth/api-key-not-valid': 'A apiKey do Firebase é inválida. Copie a configuração correta do app Web no Console do Firebase.',
  'auth/unauthorized-domain': 'Este endereço não está autorizado no Firebase. Em vez de abrir o arquivo diretamente, use um servidor local (por exemplo, Live Server) e autorize localhost em Authentication > Settings > Authorized domains.',
  'auth/configuration-not-found': 'A configuração de Authentication não foi encontrada neste projeto Firebase.',
};
const erro = (e) => {
  const code = e && e.code ? String(e.code) : '';
  if (code.startsWith('auth/api-key-not-valid')) return MSG['auth/api-key-not-valid'];
  return MSG[code] || 'Não deu certo (' + (code || (e && e.message) || 'erro') + ').';
};

$('auth-mode').addEventListener('click', () => setMode(!signup));
$('auth-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = $('auth-email').value.trim(), pass = $('auth-pass').value;
  const btn = $('auth-go');
  $('auth-err').textContent = '';
  if (!email) { $('auth-err').textContent = 'Digite o e-mail.'; return; }
  btn.disabled = true;
  try {
    if (signup) await createUserWithEmailAndPassword(auth, email, pass);
    else await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) { $('auth-err').textContent = erro(e); }
  btn.disabled = false;
});
$('auth-reset').addEventListener('click', async () => {
  const email = $('auth-email').value.trim();
  if (!email) { $('auth-err').textContent = 'Digite seu e-mail e toque de novo em "Esqueci a senha".'; return; }
  try { await sendPasswordResetEmail(auth, email); $('auth-err').textContent = 'Enviamos um link para redefinir a senha.'; }
  catch (e) { $('auth-err').textContent = erro(e); }
});

/* ---------- quando o login muda ---------- */
let started = false;
onAuthStateChanged(auth, (user) => {
  if (user) {
    if (started) return;
    started = true;
    window.LL_uid = user.uid;
    window.LL_boot();
  } else {
    const au = $('auth');
    if (au) au.style.display = 'flex';
    window.LL_splashOff();
  }
});
}
</script>
